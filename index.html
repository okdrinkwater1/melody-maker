<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>melody maker</title>
    <style>
        body{
            margin:0;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        let canvas;
        let spacing;
        let clef;
        let marginLeft;
        let blue="rgb(0,176,240)";
        let purple="rgb(204,0,153)";
        let marginRight;
        let movingNotes=[];
        let speed=0.005;
        let holdDuration=300;
        let notes=["E6","D6","C6","B5","A5","G5","F5","E5","D5","C5","B4","A4","G4","F4","E4","D4","C4","B3","A3","G3","F3"]
        let audioContext;
        let freq=[1318.5,1174.66,1046.5,987.767,880,783.991,698.456,659.255,587.33,523.251,493.883,436.04,392.44,349.228,329.628,293.665,261.626,246.942,220,195.998,174.614]
        let mouse={
            x:0,
            y:0,
            isDown:false
        }
        class Clef{
            constructor(){
                this.start=0;
                this.dur=0;
                this.isAuto=false;
            }
            drawGlyph(ctx,color){
                let size=spacing*2*5.7;
                ctx.font=size+'px "Segoe UI Symbol","Noto Music",serif';
                ctx.textAlign="center";
                ctx.fillStyle=color;
                ctx.fillText('\u{1D11E}',marginLeft,canvas.height/2+spacing*4-spacing*0.1);
                ctx.textAlign="left";
            }
            draw(ctx){
                this.drawGlyph(ctx,"black");
                let now=new Date().getTime();
                if(this.start+this.dur>now){
                    let color=this.isAuto?purple:blue;
                    ctx.globalAlpha=1-(now-this.start)/this.dur;
                    ctx.shadowColor=color;
                    ctx.shadowBlur=spacing*1.5;
                    this.drawGlyph(ctx,"black");
                    this.drawGlyph(ctx,"black");
                    ctx.shadowBlur=0;
                    ctx.shadowColor="transparent";
                    ctx.globalAlpha=1;
                }
            }
        }
        class MovingNote{
            constructor(prop,isAuto=false){
                this.location={
                    x:prop.x,
                    y:prop.y
                }
                this.born=new Date().getTime();
                this.duration=prop.dur;
                this.frequency=prop.freq;
                this.isAuto=isAuto;
            }
            draw(ctx){
                drawNotes(ctx,this.location);
            }
            play(){
                playNote(this.frequency,this.duration);
            }
        }
        function main(){
            canvas=document.getElementById('canvas');
            clef=new Clef();
            fitToScreen();
            addEventListeners();
            animate();
        }
        function playNote(freq,duration){
            if(audioContext==null){
                audioContext=new(AudioContext||webkitAudioContext||window.webkitAudioContext)();
            }
            var osc=audioContext.createOscillator();
            var gainNode=audioContext.createGain();
            gainNode.gain.setValueAtTime(0,audioContext.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.4,audioContext.currentTime+0.05);
            gainNode.gain.linearRampToValueAtTime(0,audioContext.currentTime+duration);
            osc.type="triangle";
            osc.frequency.value=freq;
            osc.start(audioContext.currentTime);
            osc.stop(audioContext.currentTime+duration);
            osc.connect(gainNode);
            gainNode.connect(audioContext.destination);
        }
        function updateMovingNotes(){
            for(let i=0;i<movingNotes.length;i++){
                movingNotes[i].location.x-=speed*canvas.width;
                if(movingNotes[i].location.x<=marginLeft){
                    movingNotes[i].play();
                    glowClef(movingNotes[i].duration,movingNotes[i].isAuto);
                    movingNotes.splice(i,1);
                    i--;
                }
            }
        }
        function animate(){
            updateMovingNotes();
            drawScene();
            window.requestAnimationFrame(animate);
        }
        function addEventListeners(){
            canvas.addEventListener('mousemove',onMouseMove);
            canvas.addEventListener('mousedown',onMouseDown);
            canvas.addEventListener('mouseup',onMouseUp);
            window.addEventListener('resize',fitToScreen);
        }
        function fitToScreen(){
            canvas.width=window.innerWidth;
            canvas.height=window.innerHeight;
            spacing=canvas.height/20;
            marginLeft=canvas.width*0.2;
            marginRight=canvas.width*0.75;
            drawScene();
        }
        function drawNotes(ctx,location){
            ctx.fillStyle="black";
            ctx.strokeStyle="black";
            ctx.lineWidth=1;
            ctx.beginPath();
            ctx.moveTo(location.x+spacing,location.y);
            ctx.lineTo(location.x+spacing,location.y-spacing*5);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(location.x+spacing,location.y-spacing*5);
            ctx.bezierCurveTo(
                location.x+spacing*2,location.y-spacing*3,
                location.x+spacing*2.5,location.y-spacing*3,
            location.x+spacing*2.5,location.y-spacing*1);
            ctx.bezierCurveTo(
                location.x+spacing*2.5,location.y-spacing*2.7,
                location.x+spacing*2,location.y-spacing*2.7,
                location.x+spacing,location.y-spacing*4.5);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.save();
            ctx.translate(location.x,location.y);
            ctx.rotate(-0.2);
            ctx.scale(1.08,0.75);
            ctx.arc(0,0,spacing,0,Math.PI*2);
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }
        function glowClef(duration,isAuto){
            clef.start=new Date().getTime();
            clef.dur=duration*1000;
            clef.isAuto=isAuto;
        }
        function onMouseMove(e){
            mouse.x=e.x;
            mouse.y=e.y;
        }
        function onMouseDown(e){
            mouse.isDown=true;
            let prop=getNoteAtLocation(mouse);
            movingNotes.push(new MovingNote(prop));
        }
        function onMouseUp(e){
            mouse.isDown=false;
        }
        function getNoteAtLocation(location){
            let index=Math.round(location.y/spacing);
            return{
                x:marginRight,
                y:index*spacing,
                freq:freq[index],
                dur:0.5
            }
        }
        function drawScene(){
            let ctx=canvas.getContext('2d');
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.strokeStyle="black";
            ctx.lineWidth=1;
            for(let i=-2;i<=2;i++){
                let y=canvas.height/2+i*spacing*2;
                ctx.beginPath();
                ctx.moveTo(0,y);
                ctx.lineTo(canvas.width,y);
                ctx.stroke();
            }
            clef.draw(ctx);
            if(mouse!=null&&mouse.isDown==false){
                drawNotes(ctx,getNoteAtLocation(mouse));
            }
            for(let i=0;i<movingNotes.length;i++){
                movingNotes[i].draw(ctx);
            }
        }
    main();
    </script>
</body>
</html>
